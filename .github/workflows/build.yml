name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:          # permite lanzarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Clonar el repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Instalar dependencias + PyInstaller
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      # 4. Generar un icono placeholder si no existe
      - name: Create placeholder icon
        shell: python
        run: |
          import struct, zlib, base64, os
          os.makedirs("installer", exist_ok=True)
          # ICO mínimo 16x16 de color azul
          def make_png(size=16):
              w = h = size
              raw = b"\x00" + bytes([0,0,255,255]*w) * h
              def chunk(name, data):
                  c = zlib.crc32(name+data) & 0xffffffff
                  return struct.pack(">I",len(data))+name+data+struct.pack(">I",c)
              sig = b"\x89PNG\r\n\x1a\n"
              ihdr = chunk(b"IHDR", struct.pack(">IIBBBBB",w,h,8,2,0,0,0))
              idat = chunk(b"IDAT", zlib.compress(raw))
              iend = chunk(b"IEND", b"")
              return sig+ihdr+idat+iend
          png = make_png(32)
          # ICO header + 32x32 entry
          ico  = struct.pack("<HHH",0,1,1)
          ico += struct.pack("<BBBBHHII",32,32,0,0,1,32,len(png),22)
          ico += png
          with open("installer/icon.ico","wb") as f: f.write(ico)
          print("Icon created.")

      # 5. Compilar con PyInstaller (GUI como entry point)
      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name StreamCodeRedeemer `
            --icon installer/icon.ico `
            --hidden-import webview `
            --hidden-import webview.platforms.winforms `
            --hidden-import clr `
            --collect-all webview `
            --hidden-import easyocr `
            --hidden-import cv2 `
            --hidden-import requests `
            --hidden-import streamlink `
            --hidden-import yt_dlp `
            --hidden-import faster_whisper `
            --hidden-import av `
            --hidden-import sources `
            --collect-all yt_dlp `
            gui.py

      # 6. Instalar Inno Setup
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # 7. Compilar el instalador .exe
      - name: Build installer
        run: |
          iscc installer\installer.iss

      # 8. Listar lo generado
      - name: List output
        run: Get-ChildItem dist\installer

      # 9. Subir el .exe como artefacto del workflow
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamCodeRedeemerSetup
          path: dist\installer\StreamCodeRedeemerSetup.exe
          retention-days: 30

      # 10. Crear un Release en GitHub con el .exe adjunto
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Stream Code Redeemer v1.0.${{ github.run_number }}"
          body: |
            ## 🎮 Stream Code Redeemer

            Instalador automático generado desde el commit `${{ github.sha }}`.

            ### Instalación
            1. Descarga `StreamCodeRedeemerSetup.exe`
            2. Ejecuta el instalador
            3. Abre la carpeta de instalación y edita `.env` con tus credenciales
            4. Corre `StreamCodeRedeemer.exe URL_DEL_STREAM`

            ### Credenciales necesarias
            - **PSN**: Cookie `NPSSO` desde https://ca.account.sony.com/api/v1/ssocookie
            - **Xbox**: Token `XBL3.0` (usa xbox-webapi-python)
          files: dist\installer\StreamCodeRedeemerSetup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
